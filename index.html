<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BESS Battery Monitoring Dashboard</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { background-color: #0b0f19; color: #f8fafc; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; font-size: 1.4rem; overflow-x: hidden; }
        .card { background-color: #1a2234; border: 1px solid #2a364f; border-radius: 16px; box-shadow: 0 8px 16px rgba(0,0,0,0.4); color: #fff; transition: transform 0.2s; }
        .card:hover { border-color: #38bdf8; }
        
        .status-badge { font-size: 2rem !important; padding: 15px 40px; border-radius: 50px; font-weight: bold; letter-spacing: 1px; }
        
        .sidebar-card { background-color: #161e2e; border: 1px solid #2a364f; border-radius: 16px; padding: 20px 15px; position: sticky; top: 20px; }
        .nav-link-custom { display: block; padding: 16px 20px; color: #94a3b8; font-size: 1.3rem !important; font-weight: 700; text-decoration: none; border-radius: 12px; margin-bottom: 10px; transition: all 0.2s; }
        .nav-link-custom:hover { background-color: #1e293b; color: #38bdf8; }
        .nav-link-custom.active { background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%); color: #fff; box-shadow: 0 4px 12px rgba(2, 132, 199, 0.4); }

        .summary-card { background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%); border-left: 14px solid #38bdf8; border: 1px solid #334155; }
        
        .content-section { display: none; }
        .content-section.active { display: block; }

        @media (max-width: 768px) {
            body { font-size: 1rem; }
            .status-badge { font-size: 1.2rem !important; padding: 8px 20px; }
        }
    </style>
</head>
<body>

    <div class="container-fluid py-4 px-4">
        <!-- Header -->
        <div class="row mb-4 align-items-center">
            <div class="col-xl-9 col-lg-8">
                <h1 class="fw-bold text-white display-3"><i class="fa-solid fa-car-battery text-info"></i> BESS Lab RMUTT - Battery Dashboard</h1>
                <p class="text-secondary fs-2 mb-0">ระบบมอนิเตอร์แรงดันและอุณหภูมิแบบเรียลไทม์ (5 Nodes)</p>
            </div>
            <div class="col-xl-3 col-lg-4 text-lg-end mt-3 mt-lg-0">
                <span id="systemStatus" class="badge bg-success status-badge">NORMAL</span>
            </div>
        </div>

        <div class="row g-4">
            <!-- Sidebar Navigation -->
            <div class="col-lg-3 col-xl-2">
                <div class="sidebar-card">
                    <h3 class="fw-bold text-white mb-3 fs-3"><i class="fa-solid fa-bars-staggered text-info"></i> เมนู</h3>
                    <div class="nav flex-column">
                        <a href="#" class="nav-link-custom active" onclick="switchTab('overview', event)">
                            <i class="fa-solid fa-house-chimney me-2"></i> หน้าหลัก
                        </a>
                        <a href="#" class="nav-link-custom" onclick="switchTab('bmu1', event)">
                            <i class="fa-solid fa-microchip me-2"></i> BMU-01
                        </a>
                        <a href="#" class="nav-link-custom" onclick="switchTab('bmu2', event)">
                            <i class="fa-solid fa-microchip me-2"></i> BMU-02
                        </a>
                        <a href="#" class="nav-link-custom" onclick="switchTab('bmu3', event)">
                            <i class="fa-solid fa-microchip me-2"></i> BMU-03
                        </a>
                        <a href="#" class="nav-link-custom" onclick="switchTab('bmu4', event)">
                            <i class="fa-solid fa-microchip me-2"></i> BMU-04
                        </a>
                        <a href="#" class="nav-link-custom" onclick="switchTab('bmu5', event)">
                            <i class="fa-solid fa-microchip me-2"></i> BMU-05
                        </a>
                    </div>
                </div>
            </div>

            <!-- Main Content Area -->
            <div class="col-lg-9 col-xl-10">
                
                <!-- ================= TAB 1: OVERVIEW ================= -->
                <div id="section-overview" class="content-section active">
                    <div class="row mb-4">
                        <div class="col-12">
                            <div class="card summary-card p-4">
                                <div class="d-flex justify-content-between align-items-center">
                                    <div>
                                        <span class="badge bg-info text-dark mb-2 px-3 py-2 fs-3 fw-bold">แรงดันรวมทั้งระบบ (COMBINED VOLTAGE MODULE 1 - 35)</span>
                                        <h1 class="text-white display-1 fw-bold mb-0 mt-2"><span id="systemTotalVoltage">0.00</span> <span class="display-2 text-info">V</span></h1>
                                    </div>
                                    <div>
                                        <svg style="width: 130px; height: 130px;" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                            <rect x="7" y="2" width="10" height="3" rx="1.5" fill="#38bdf8"/>
                                            <rect x="4" y="5" width="16" height="17" rx="3" stroke="#38bdf8" stroke-width="2" fill="#1e293b"/>
                                            <path d="M12 8L9 13H13L11 18L15 12H11L12 8Z" fill="#facc15" stroke="#facc15" stroke-width="0.5"/>
                                        </svg>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- หน้าหลัก: กราฟเส้นแรงดันรวมตามเวลา -->
                    <div class="row mb-4">
                        <div class="col-12">
                            <div class="card p-4">
                                <h2 class="fw-bold mb-3 text-info display-6"><i class="fa-solid fa-chart-line"></i> กราฟเส้นแนวโน้มแรงดันรวม</h2>
                                <div style="position: relative; height: 450px;"><canvas id="voltageLineHistoryChart"></canvas></div>
                            </div>
                        </div>
                    </div>

                    <!-- หน้าหลัก: กราฟเส้นอุณหภูมิรวมตามเวลา -->
                    <div class="row mb-4">
                        <div class="col-12">
                            <div class="card p-4">
                                <h2 class="fw-bold mb-3 text-success display-6"><i class="fa-solid fa-chart-line"></i> กราฟเส้นแนวโน้มอุณหภูมิ</h2>
                                <div style="position: relative; height: 450px;"><canvas id="tempLineHistoryChart"></canvas></div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- ================= TAB: BMU 1 ถึง 5 (เปลี่ยนเป็นกราฟแท่งทั้งหมด) ================= -->
                <script>
                    // สร้างโครงสร้าง Tab ของ BMU 1 ถึง 5 แบบอัตโนมัติ
                    for (let bmu = 1; bmu <= 5; bmu++) {
                        document.write(`
                            <div id="section-bmu${bmu}" class="content-section">
                                <h2 class="fw-bold mb-4 text-warning display-5"><i class="fa-solid fa-bolt"></i> รายละเอียดชุดอุปกรณ์ BMU-0${bmu}</h2>
                                <div class="row mb-4">
                                    <div class="col-xl-6 mb-4 mb-xl-0">
                                        <div class="card p-4">
                                            <h3 class="fw-bold mb-3 text-info fs-3">กราฟแท่งแรงดันรายโมดูล (BMU-0${bmu})</h3>
                                            <div style="position: relative; height: 350px;"><canvas id="bmu${bmu}VoltageBarChart"></canvas></div>
                                        </div>
                                    </div>
                                    <div class="col-xl-6">
                                        <div class="card p-4">
                                            <h3 class="fw-bold mb-3 text-success fs-3">กราฟแท่งอุณหภูมิระบบ (BMU-0${bmu})</h3>
                                            <div style="position: relative; height: 350px;"><canvas id="bmu${bmu}TempBarChart"></canvas></div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        `);
                    }
                </script>

            </div>
        </div>
    </div>

    <!-- JavaScript -->
    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbz5mQzeJF-Y2slav6xw_KRFgmv31OSIYmieOO2tja9IYvugylfWp62wwnZCE2RWPXjmyQ/exec";

        function switchTab(tabId, event) {
            event.preventDefault();
            document.querySelectorAll('.content-section').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-link-custom').forEach(el => el.classList.remove('active'));
            
            document.getElementById('section-' + tabId).classList.add('active');
            event.currentTarget.classList.add('active');
        }

        Chart.defaults.color = '#e2e8f0';
        Chart.defaults.borderColor = '#2a364f';
        Chart.defaults.font.size = 16;

        // หน้าหลัก: กราฟเส้นรวม
        const voltageLineHistoryChart = new Chart(document.getElementById('voltageLineHistoryChart').getContext('2d'), {
            type: 'line',
            data: { labels: [], datasets: [{ label: 'Total Voltage (V)', data: [], borderColor: '#38bdf8', backgroundColor: 'rgba(56, 189, 248, 0.2)', borderWidth: 3, fill: true, tension: 0.3, pointRadius: 4 }] },
            options: { responsive: true, maintainAspectRatio: false, scales: { x: { title: { display: true, text: 'เวลา (Time)' } }, y: { title: { display: true, text: 'Voltage (V)' } } } }
        });

        const tempLineHistoryChart = new Chart(document.getElementById('tempLineHistoryChart').getContext('2d'), {
            type: 'line',
            data: { labels: [], datasets: [{ label: 'Avg Temperature (°C)', data: [], borderColor: '#34d399', backgroundColor: 'rgba(52, 211, 153, 0.2)', borderWidth: 3, fill: true, tension: 0.3, pointRadius: 4 }] },
            options: { responsive: true, maintainAspectRatio: false, scales: { x: { title: { display: true, text: 'เวลา (Time)' } }, y: { title: { display: true, text: 'Temperature (°C)' } } } }
        });

        // สร้างกราฟแท่งสำหรับแต่ละ BMU (แรงดัน M1-M7 และ อุณหภูมิ T1, T4, Room)
        const bmuVoltageBarCharts = {};
        const bmuTempBarCharts = {};

        for (let bmu = 1; bmu <= 5; bmu++) {
            bmuVoltageBarCharts[bmu] = new Chart(document.getElementById(`bmu${bmu}VoltageBarChart`).getContext('2d'), {
                type: 'bar',
                data: {
                    labels: ['M1', 'M2', 'M3', 'M4', 'M5', 'M6', 'M7'],
                    datasets: [{
                        label: 'Voltage (V)',
                        data: Array(7).fill(0),
                        backgroundColor: 'rgba(56, 189, 248, 0.8)',
                        borderColor: '#38bdf8',
                        borderWidth: 1,
                        borderRadius: 6
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: { y: { beginAtZero: true, max: 8.5 } }
                }
            });

            bmuTempBarCharts[bmu] = new Chart(document.getElementById(`bmu${bmu}TempBarChart`).getContext('2d'), {
                type: 'bar',
                data: {
                    labels: ['T1 (NTC1)', 'T4 (NTC4)', 'Room Temp'],
                    datasets: [{
                        label: 'Temperature (°C)',
                        data: Array(3).fill(0),
                        backgroundColor: 'rgba(52, 211, 153, 0.8)',
                        borderColor: '#34d399',
                        borderWidth: 1,
                        borderRadius: 6
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: { y: { beginAtZero: true, max: 70 } }
                }
            });
        }

        async function fetchData() {
            try {
                let response = await fetch(WEB_APP_URL);
                let data = await response.json();
                
                if(data && data.values) {
                    let vals = data.values;
                    let totalSystemVoltage = 0;

                    let valIdx = 0;
                    for (let bmu = 1; bmu <= 5; bmu++) {
                        let bmuV = [];
                        let bmuT = [];

                        for (let i = 0; i < 7; i++) {
                            let v = parseFloat(vals[valIdx]) || 0;
                            totalSystemVoltage += v;
                            bmuV.push(v);
                            valIdx++;
                        }
                        for (let i = 0; i < 3; i++) {
                            let t = parseFloat(vals[valIdx]) || 0;
                            bmuT.push(t);
                            valIdx++;
                        }
                        valIdx++; // ข้ามสถานะ

                        // อัปเดตกราฟแท่งสดๆ ของแต่ละ BMU
                        bmuVoltageBarCharts[bmu].data.datasets[0].data = bmuV;
                        bmuVoltageBarCharts[bmu].update();
                        bmuTempBarCharts[bmu].data.datasets[0].data = bmuT;
                        bmuTempBarCharts[bmu].update();
                    }

                    document.getElementById('systemTotalVoltage').innerText = totalSystemVoltage.toFixed(2);

                    // จัดการข้อมูลประวัติ (History) สำหรับหน้าหลัก
                    if (data.history && Array.isArray(data.history)) {
                        let timeLabels = [];
                        let totalVoltHistory = [];
                        let avgTempHistory = [];

                        data.history.forEach(row => {
                            let timestamp = new Date(row[0]);
                            let timeStr = !isNaN(timestamp) ? timestamp.toLocaleTimeString() : "N/A";
                            timeLabels.push(timeStr);

                            let rowVoltSum = 0;
                            let rowTempSum = 0;
                            let tempCount = 0;
                            
                            for (let b = 1; b <= 5; b++) {
                                let baseIdx = 1 + (b - 1) * 11;
                                for (let vi = 0; vi < 7; vi++) {
                                    rowVoltSum += parseFloat(row[baseIdx + vi]) || 0;
                                }
                                for (let ti = 0; ti < 3; ti++) {
                                    rowTempSum += parseFloat(row[baseIdx + 7 + ti]) || 0;
                                    tempCount++;
                                }
                            }

                            totalVoltHistory.push(rowVoltSum);
                            avgTempHistory.push(tempCount > 0 ? (rowTempSum / tempCount).toFixed(1) : 0);
                        });

                        voltageLineHistoryChart.data.labels = timeLabels;
                        voltageLineHistoryChart.data.datasets[0].data = totalVoltHistory;
                        voltageLineHistoryChart.update();

                        tempLineHistoryChart.data.labels = timeLabels;
                        tempLineHistoryChart.data.datasets[0].data = avgTempHistory;
                        tempLineHistoryChart.update();
                    }

                    let badge = document.getElementById('systemStatus');
                    badge.innerText = "NORMAL";
                    badge.className = "badge status-badge bg-success";
                }
            } catch (error) {
                console.error("Error fetching data:", error);
            }
        }

        setInterval(fetchData, 3000);
        fetchData();
    </script>
</body>
</html>
