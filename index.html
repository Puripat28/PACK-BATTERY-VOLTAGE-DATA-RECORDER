<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>28 Modules BMS Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --green: #10b981;
      --yellow: #f59e0b;
      --orange: #f97316;
      --red: #ef4444;
      --primary: #3b82f6;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 15px;
    }
    .header { text-align: center; margin-bottom: 15px; }
    h1 { margin: 0; color: #fff; font-size: 24px; }
    .update-time { color: var(--text-sub); font-size: 13px; margin-top: 4px; }

    /* แถบสรุปสถานะรวมด้านบน */
    .status-banner {
      max-width: 1400px;
      margin: 0 auto 15px auto;
      background: var(--card-bg);
      border-radius: 10px;
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3);
      border: 1px solid #334155;
    }
    .sys-status {
      font-size: 16px;
      font-weight: bold;
      padding: 4px 16px;
      border-radius: 15px;
      color: #fff;
      background-color: var(--green);
    }
    .total-volt { font-size: 18px; font-weight: bold; }

    .main-container {
      max-width: 1400px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .section-title {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 12px;
      color: #e2e8f0;
      border-left: 4px solid var(--primary);
      padding-left: 10px;
    }

    /* 🔋 ตารางแสดงแท่งแบตเตอรี่ 28 โมดูล (Grid 7 คอลัมน์) */
    .battery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      gap: 10px;
    }
    .bat-card {
      background: var(--card-bg);
      border-radius: 8px;
      padding: 10px;
      text-align: center;
      border: 1px solid #334155;
      position: relative;
    }
    .bat-card h3 { margin: 0 0 6px 0; font-size: 13px; color: var(--text-sub); }

    /* โครงสร้างตัวแบตเตอรี่ */
    .battery-icon {
      width: 32px;
      height: 55px;
      border: 2px solid #64748b;
      border-radius: 4px;
      margin: 0 auto 6px auto;
      position: relative;
      padding: 1px;
      background: #0f172a;
    }
    .battery-icon::before {
      content: '';
      position: absolute;
      top: -5px;
      left: 50%;
      transform: translateX(-50%);
      width: 12px;
      height: 4px;
      background: #64748b;
      border-radius: 1px 1px 0 0;
    }
    .battery-level {
      width: calc(100% - 2px);
      height: 0%;
      background-color: var(--green);
      border-radius: 2px;
      position: absolute;
      bottom: 1px;
      left: 1px;
      transition: height 0.4s, background-color 0.4s;
    }

    .bat-value { font-size: 15px; font-weight: bold; color: #fff; }
    .bat-unit { font-size: 11px; color: var(--text-sub); }

    /* แท็กอุณหภูมิต่อท้ายแบตเตอรี่ */
    .temp-badge {
      margin-top: 6px;
      padding: 3px 6px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: bold;
      background-color: #0f172a;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }
    .temp-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
    }

    /* กล่องกราฟ */
    .charts-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }
    @media (max-width: 900px) { .charts-grid { grid-template-columns: 1fr; } }

    .chart-box {
      background: var(--card-bg);
      border-radius: 10px;
      padding: 15px;
      border: 1px solid #334155;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>BMS Monitor Dashboard (28 Modules)</h1>
    <div class="update-time">อัปเดตล่าสุด: <span id="timestamp">กำลังโหลด...</span></div>
  </div>

  <!-- สถานะภาพรวม -->
  <div class="status-banner">
    <div>
      <span style="color: var(--text-sub); font-size: 11px;">OVERVIEW STATUS</span>
      <div id="sys-status-text" class="sys-status">LOADING</div>
    </div>
    <div class="total-volt">
      Total Volt: <span id="total-v" style="color: var(--primary);">0.00</span> <span style="font-size: 12px; color:var(--text-sub);">V</span>
    </div>
  </div>

  <div class="main-container">
    
    <!-- แท่งแบตเตอรี่ทั้ง 28 โมดูล -->
    <div>
      <div class="section-title">28 Modules Real-Time Status</div>
      <div class="battery-grid" id="battery-grid">
        <!-- สร้าง 28 โมดูลด้วย JS -->
      </div>
    </div>

    <!-- โซนกราฟแท่งเปรียบเทียบ -->
    <div class="charts-grid">
      <div class="chart-box">
        <div class="section-title">Voltage Compare Chart (28 Modules)</div>
        <canvas id="voltageChart" height="130"></canvas>
      </div>
      <div class="chart-box">
        <div class="section-title" style="border-left-color: var(--orange);">Temperature Compare Chart (28 Modules)</div>
        <canvas id="tempChart" height="130"></canvas>
      </div>
    </div>

  </div>

  <script>
    // ⚠️ วาง URL ของ Google Apps Script ของคุณตรงนี้
    const webAppUrl = "วาง_URL_ของ_Google_Apps_Script_ที่นี่";

    // สร้างกล่องการ์ดแบตเตอรี่ 28 โมดูล
    const batteryGrid = document.getElementById('battery-grid');
    const moduleLabels = [];
    
    for (let i = 1; i <= 28; i++) {
      moduleLabels.push('M' + i);
      batteryGrid.innerHTML += `
        <div class="bat-card">
          <h3>Module ${i}</h3>
          <div class="battery-icon">
            <div class="battery-level" id="level-m${i}"></div>
          </div>
          <div class="bat-value"><span id="v-m${i}">0.00</span> <span class="bat-unit">V</span></div>
          <div class="temp-badge">
            <span class="temp-dot" id="tdot-m${i}"></span>
            <span id="t-m${i}">0.0</span> <span style="font-size:10px; color:#94a3b8;">°C</span>
          </div>
        </div>
      `;
    }

    // 📊 กราฟแรงดัน 28 แท่ง
    const ctxVolt = document.getElementById('voltageChart').getContext('2d');
    const voltageChart = new Chart(ctxVolt, {
      type: 'bar',
      data: {
        labels: moduleLabels,
        datasets: [{
          label: 'Voltage (V)',
          data: Array(28).fill(0),
          backgroundColor: 'rgba(59, 130, 246, 0.75)',
          borderColor: 'rgba(59, 130, 246, 1)',
          borderWidth: 1,
          borderRadius: 2
        }]
      },
      options: {
        scales: { y: { min: 0, max: 10, ticks: { color: '#94a3b8' } }, x: { ticks: { color: '#94a3b8', font: { size: 9 } } } },
        plugins: { legend: { display: false } }
      }
    });

    // 📊 กราฟอุณหภูมิ 28 แท่ง
    const ctxTemp = document.getElementById('tempChart').getContext('2d');
    const tempChart = new Chart(ctxTemp, {
      type: 'bar',
      data: {
        labels: moduleLabels,
        datasets: [{
          label: 'Temp (°C)',
          data: Array(28).fill(0),
          backgroundColor: 'rgba(249, 115, 22, 0.75)',
          borderColor: 'rgba(249, 115, 22, 1)',
          borderWidth: 1,
          borderRadius: 2
        }]
      },
      options: {
        scales: { y: { min: 0, max: 80, ticks: { color: '#94a3b8' } }, x: { ticks: { color: '#94a3b8', font: { size: 9 } } } },
        plugins: { legend: { display: false } }
      }
    });

    function updateDashboard() {
      fetch(webAppUrl)
        .then(res => res.json())
        .then(data => {
          if (data && data.length > 0) {
            const latest = data[0];
            let totalVolt = 0;
            let hasYellow = false;
            let hasRed = false;
            
            let voltDataArr = [];
            let tempDataArr = [];

            for (let i = 1; i <= 28; i++) {
              // อ่านค่า V1..V28 และ T1..T28 จาก Google Sheet
              let v = parseFloat(latest['m' + i] || latest['v' + i]) || 0;
              let t = parseFloat(latest['t' + i]) || 0;

              voltDataArr.push(v);
              tempDataArr.push(t);
              totalVolt += v;

              // แสดงตัวเลข
              document.getElementById('v-m' + i).innerText = v.toFixed(2);
              document.getElementById('t-m' + i).innerText = t.toFixed(1);

              let level = document.getElementById('level-m' + i);
              let tDot = document.getElementById('tdot-m' + i);

              // 1. คำนวณเปอร์เซ็นต์ความสูงแบตเตอรี่ (เทียบสเกล 0V - 9.0V)
              let pct = Math.min(Math.max((v / 9.0) * 100, 5), 100);
              level.style.height = pct + '%';

              // 2. เงื่อนไขสีแรงดัน
              if (v >= 7.60 && v <= 8.40) {
                level.style.backgroundColor = 'var(--green)';
              } else if ((v >= 7.20 && v < 7.60) || (v > 8.40 && v <= 8.60)) {
                level.style.backgroundColor = 'var(--yellow)';
                hasYellow = true;
              } else {
                level.style.backgroundColor = 'var(--red)';
                hasRed = true;
              }

              // 3. เงื่อนไขสีอุณหภูมิ
              if (t >= 20 && t <= 40) {
                tDot.style.backgroundColor = 'var(--green)';
              } else if (t > 40 && t <= 50) {
                tDot.style.backgroundColor = 'var(--orange)';
                if (!hasRed) hasYellow = true;
              } else {
                tDot.style.backgroundColor = 'var(--red)';
                hasRed = true;
              }
            }

            // อัปเดต Total Voltage และ กราฟ
            document.getElementById('total-v').innerText = totalVolt.toFixed(2);
            voltageChart.data.datasets[0].data = voltDataArr;
            voltageChart.update();

            tempChart.data.datasets[0].data = tempDataArr;
            tempChart.update();

            // อัปเดตป้ายสถานะระบบ
            let statusText = document.getElementById('sys-status-text');
            if (hasRed) {
              statusText.innerText = "DANGER / CRITICAL";
              statusText.style.backgroundColor = "var(--red)";
            } else if (hasYellow) {
              statusText.innerText = "WARNING";
              statusText.style.backgroundColor = "var(--yellow)";
            } else {
              statusText.innerText = "ALL SYSTEMS NORMAL";
              statusText.style.backgroundColor = "var(--green)";
            }

            let timeObj = new Date(latest.timestamp);
            document.getElementById('timestamp').innerText = timeObj.toLocaleString('th-TH');
          }
        })
        .catch(err => console.error("Fetch Data Error: ", err));
    }

    updateDashboard();
    setInterval(updateDashboard, 5000); // ดึงข้อมูลใหม่ทุกๆ 5 วินาที
  </script>
</body>
</html>
