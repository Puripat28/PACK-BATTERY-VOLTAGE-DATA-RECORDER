<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BESS Battery Monitoring Dashboard</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { background-color: #f8f9fa; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .card { border: none; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .status-badge { font-size: 1.1rem; padding: 8px 20px; border-radius: 50px; }
        .module-card { background: #fff; border-left: 5px solid #0d6efd; transition: 0.3s; }
        .module-card.warning { border-left-color: #ffc107; }
        .module-card.danger { border-left-color: #dc3545; }
    </style>
</head>
<body>

    <div class="container py-4">
        <!-- Header -->
        <div class="row mb-4 align-items-center">
            <div class="col-md-8">
                <h2 class="fw-bold text-dark">🔋 BESS Lab RMUTT - Battery Dashboard</h2>
                <p class="text-muted mb-0">ระบบมอนิเตอร์แรงดันและอุณหภูมิแบตเตอรี่ 14 โมดูล (BMU-01 & BMU-02)</p>
            </div>
            <div class="col-md-4 text-md-end mt-3 mt-md-0">
                <span id="systemStatus" class="badge bg-success status-badge">NORMAL</span>
            </div>
        </div>

        <!-- Node 1 & Node 2 Modules (14 Modules) -->
        <div class="row mb-4">
            <div class="col-12">
                <h4 class="fw-bold mb-3">⚡ แรงดันรายโมดูล (Module Voltages)</h4>
            </div>
            <div id="moduleContainer" class="row g-3"></div>
        </div>

        <!-- Temperatures (6 Points) -->
        <div class="row mb-4">
            <div class="col-12">
                <h4 class="fw-bold mb-3">🌡️ อุณหภูมิระบบ (Temperature Sensors)</h4>
            </div>
            <div id="tempContainer" class="row g-3"></div>
        </div>

        <!-- Charts Section -->
        <div class="row g-4">
            <div class="col-lg-6">
                <div class="card p-4">
                    <h5 class="fw-bold mb-3">📈 กราฟแรงดันโมดูล (Voltage Trend)</h5>
                    <canvas id="voltageChart" height="150"></canvas>
                </div>
            </div>
            <div class="col-lg-6">
                <div class="card p-4">
                    <h5 class="fw-bold mb-3">📉 กราฟอุณหภูมิ (Temperature Trend)</h5>
                    <canvas id="tempChart" height="150"></canvas>
                </div>
            </div>
        </div>
    </div>

    <!-- JavaScript สำหรับดึงข้อมูลและแสดงผล -->
    <script>
        // แทนที่ด้วย URL Web App ของ Google Apps Script ของคุณ
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwPwrfUgh1tFGT7YmXZEMPjAruVInk3cc17Ywppld8Wxsdc0YkKmdHkAdOhZd65jgcofQ/exec";

        // สร้างโครงสร้างการ์ดโมดูล (14 โมดูล)
        const moduleContainer = document.getElementById('moduleContainer');
        for (let i = 1; i <= 14; i++) {
            let nodeName = i <= 7 ? "Node 1 (BMU-01)" : "Node 2 (BMU-02)";
            let modIdx = ((i - 1) % 7) + 1;
            moduleContainer.innerHTML += `
                <div class="col-md-3 col-sm-6">
                    <div class="card module-card p-3">
                        <small class="text-muted">${nodeName}</small>
                        <h6 class="fw-bold mt-1">Module ${modIdx}</h6>
                        <h3 class="text-primary mb-0"><span id="m${i}">0.000</span> <span class="fs-6">V</span></h3>
                    </div>
                </div>`;
        }

        // สร้างโครงสร้างการ์ดอุณหภูมิ (6 จุด)
        const tempContainer = document.getElementById('tempContainer');
        const tempNames = [
            "Node 1: T1 (NTC1)", "Node 1: T4 (NTC4)", "Node 1: Room Temp", 
            "Node 2: T1 (NTC1)", "Node 2: T4 (NTC4)", "Node 2: Room Temp"
        ];
        for (let i = 1; i <= 6; i++) {
            tempContainer.innerHTML += `
                <div class="col-md-4 col-sm-6">
                    <div class="card p-3 border-start border-warning border-4">
                        <small class="text-muted">${tempNames[i-1]}</small>
                        <h3 class="text-danger mb-0 mt-1"><span id="t${i}">0.0</span> <span class="fs-6">°C</span></h3>
                    </div>
                </div>`;
        }

        // ตั้งค่ากราฟ Chart.js
        const ctxV = document.getElementById('voltageChart').getContext('2d');
        const voltageChart = new Chart(ctxV, {
            type: 'line',
            data: { labels: [], datasets: [{ label: 'Node 1 - M1 Voltage (V)', data: [], borderColor: '#0d6efd', tension: 0.1 }] },
            options: { responsive: true }
        });

        const ctxT = document.getElementById('tempChart').getContext('2d');
        const tempChart = new Chart(ctxT, {
            type: 'line',
            data: { labels: [], datasets: [{ label: 'Node 1 - T1 (°C)', data: [], borderColor: '#dc3545', tension: 0.1 }] },
            options: { responsive: true }
        });

        // ฟังก์ชันดึงข้อมูลจาก Google Sheets Web App
        async function fetchData() {
            try {
                let response = await fetch(WEB_APP_URL);
                let data = await response.json();
                
                if(data && data.values) {
                    let vals = data.values;
                    
                    // ปรับลำดับการอ่าน Index ตามชุดข้อมูลจริง:
                    // Node 1 Voltages: Index 0 - 6 (7 โมดูล)
                    // Node 1 Temps:    Index 7 - 9 (3 ค่า)
                    // Node 2 Temps:    Index 10 - 12 (3 ค่า - ถูกเลื่อนขึ้นมาอยู่ก่อนแรงดัน Node 2 ในอาเรย์ที่ส่งมา)
                    // Node 2 Voltages: Index 13 - 19 (7 โมดูล)
                    // Status:          Index 20

                    // 1. แรงดัน Node 1 (โมดูล 1-7) -> Index 0 ถึง 6
                    for (let i = 0; i < 7; i++) {
                        document.getElementById(`m${i+1}`).innerText = parseFloat(vals[i]).toFixed(3);
                    }

                    // 2. อุณหภูมิ Node 1 -> Index 7 ถึง 9
                    for (let i = 0; i < 3; i++) {
                        document.getElementById(`t${i+1}`).innerText = parseFloat(vals[7 + i]).toFixed(1);
                    }

                    // 3. อุณหภูมิ Node 2 -> Index 10 ถึง 12
                    for (let i = 0; i < 3; i++) {
                        document.getElementById(`t${i+4}`).innerText = parseFloat(vals[10 + i]).toFixed(1);
                    }

                    // 4. แรงดัน Node 2 (โมดูล 1-7) -> Index 13 ถึง 19
                    for (let i = 0; i < 7; i++) {
                        document.getElementById(`m${i+8}`).innerText = parseFloat(vals[13 + i]).toFixed(3);
                    }

                    // 5. แสดงสถานะระบบ -> Index 20
                    let status = vals[20];
                    let badge = document.getElementById('systemStatus');
                    badge.innerText = status;
                    badge.className = "badge status-badge " + (status === "NORMAL" ? "bg-success" : (status === "WARNING" ? "bg-warning text-dark" : "bg-danger"));
                }
            } catch (error) {
                console.error("Error fetching data:", error);
            }
        }

        // ดึงข้อมูลอัตโนมัติทุกๆ 3 วินาที
        setInterval(fetchData, 3000);
        // เรียกใช้งานทันทีเมื่อโหลดหน้าเว็บ
        fetchData();
    </script>
</body>
</html>
