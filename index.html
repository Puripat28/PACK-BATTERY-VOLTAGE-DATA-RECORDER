<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pack Battery Voltage Data Recorder Dashboard</title>
  <!-- Chart.js สำหรับวาดกราฟ -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --accent-blue: #38bdf8;
      --status-ok: #22c55e;
      --status-warn: #ef4444;
      --status-off: #64748b;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 20px;
      border-bottom: 1px solid #334155;
      margin-bottom: 20px;
    }

    h1 {
      margin: 0;
      font-size: 1.8rem;
      color: var(--accent-blue);
    }

    .last-update {
      font-size: 0.9rem;
      color: var(--text-sub);
    }

    /* Total Summary Banner */
    .summary-card {
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      border: 1px solid #334155;
      border-left: 6px solid var(--accent-blue);
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 25px;
      display: flex;
      justify-content: space-around;
      align-items: center;
      text-align: center;
    }

    .summary-item .title {
      font-size: 0.9rem;
      color: var(--text-sub);
      margin-bottom: 5px;
    }

    .summary-item .value {
      font-size: 2.2rem;
      font-weight: bold;
      color: var(--accent-blue);
    }

    /* Grid Displays */
    .section-title {
      font-size: 1.2rem;
      margin-bottom: 15px;
      color: #e2e8f0;
      border-left: 4px solid var(--accent-blue);
      padding-left: 10px;
    }

    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 12px;
      margin-bottom: 30px;
    }

    .card {
      background-color: var(--card-bg);
      border-radius: 8px;
      padding: 12px;
      text-align: center;
      border: 1px solid #334155;
      position: relative;
      transition: transform 0.2s;
    }

    .card:hover {
      transform: translateY(-2px);
    }

    .card .label {
      font-size: 0.8rem;
      color: var(--text-sub);
      margin-bottom: 6px;
    }

    .card .val {
      font-size: 1.2rem;
      font-weight: bold;
    }

    /* Status Indicators */
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      position: absolute;
      top: 8px;
      right: 8px;
    }

    .state-ok { border-color: var(--status-ok); }
    .state-ok .val { color: var(--status-ok); }
    .state-ok .status-dot { background-color: var(--status-ok); box-shadow: 0 0 6px var(--status-ok); }

    .state-warn { border-color: var(--status-warn); }
    .state-warn .val { color: var(--status-warn); }
    .state-warn .status-dot { background-color: var(--status-warn); box-shadow: 0 0 6px var(--status-warn); }

    .state-off { border-color: var(--status-off); opacity: 0.6; }
    .state-off .val { color: var(--status-off); }
    .state-off .status-dot { background-color: var(--status-off); }

    /* Chart Section */
    .charts-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
    }

    .chart-box {
      background-color: var(--card-bg);
      border-radius: 10px;
      padding: 15px;
      border: 1px solid #334155;
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <div>
      <h1>Pack Battery Voltage Data Recorder</h1>
      <div style="font-size: 0.85rem; color: var(--text-sub);">Real-time Battery Management & Monitoring System</div>
    </div>
    <div class="last-update">อัปเดตล่าสุด: <span id="time-stamp">กำลังดึงข้อมูล...</span></div>
  </header>

  <!-- สรุปแรงดันรวม -->
  <div class="summary-card">
    <div class="summary-item">
      <div class="title">แรงดันรวมทั้งหมด (Total Pack Voltage)</div>
      <div class="value"><span id="total-voltage">0.00</span> V</div>
    </div>
    <div class="summary-item">
      <div class="title">สถานะระบบ (Active Modules)</div>
      <div class="value" style="color: var(--text-main);"><span id="active-count">0</span> / 35</div>
    </div>
  </div>

  <!-- แรงดัน 35 โมดูล -->
  <div class="section-title">แรงดันแต่ละโมดูล (35 Modules Voltage)</div>
  <div class="grid-container" id="voltage-grid"></div>

  <!-- อุณหภูมิ 10 จุด -->
  <div class="section-title">อุณหภูมิความร้อน (10 Temp Sensors)</div>
  <div class="grid-container" id="temp-grid"></div>

  <!-- แสดงกราฟ -->
  <div class="charts-grid">
    <div class="chart-box">
      <canvas id="voltageChart" height="90"></canvas>
    </div>
    <div class="chart-box">
      <canvas id="tempChart" height="80"></canvas>
    </div>
  </div>
</div>

<script>
  // ⚠️ วาง URL Google Apps Script Web App ของคุณที่นี่
  const GAS_URL = "วาง_URL_ของ_Google_Apps_Script_ที่นี่";

  let vChart, tChart;

  // สร้างองค์ประกอบการ์ดเปล่าล่วงหน้า 35 V และ 10 T
  function initGrids() {
    const vGrid = document.getElementById('voltage-grid');
    for (let i = 1; i <= 35; i++) {
      vGrid.innerHTML += `
        <div class="card state-off" id="card-m${i}">
          <div class="status-dot"></div>
          <div class="label">Module ${i}</div>
          <div class="val" id="val-m${i}">0.00 V</div>
        </div>`;
    }

    const tGrid = document.getElementById('temp-grid');
    for (let i = 1; i <= 10; i++) {
      tGrid.innerHTML += `
        <div class="card state-off" id="card-t${i}">
          <div class="status-dot"></div>
          <div class="label">Temp ${i}</div>
          <div class="val" id="val-t${i}">0.0 °C</div>
        </div>`;
    }
  }

  // สร้างกราฟล่วงหน้า
  function initCharts() {
    const vCtx = document.getElementById('voltageChart').getContext('2d');
    vChart = new Chart(vCtx, {
      type: 'bar',
      data: {
        labels: Array.from({length: 35}, (_, i) => `M${i+1}`),
        datasets: [{
          label: 'Voltage (V)',
          data: Array(35).fill(0),
          backgroundColor: '#38bdf8'
        }]
      },
      options: {
        responsive: true,
        plugins: { title: { display: true, text: 'Voltage Profile (M1 - M35)', color: '#f8fafc' } },
        scales: { y: { beginAtZero: true, grid: { color: '#334155' } }, x: { grid: { display: false } } }
      }
    });

    const tCtx = document.getElementById('tempChart').getContext('2d');
    tChart = new Chart(tCtx, {
      type: 'bar',
      data: {
        labels: Array.from({length: 10}, (_, i) => `T${i+1}`),
        datasets: [{
          label: 'Temperature (°C)',
          data: Array(10).fill(0),
          backgroundColor: '#f97316'
        }]
      },
      options: {
        responsive: true,
        plugins: { title: { display: true, text: 'Temperature Profile (T1 - T10)', color: '#f8fafc' } },
        scales: { y: { beginAtZero: true, grid: { color: '#334155' } }, x: { grid: { display: false } } }
      }
    });
  }

  // ดึงข้อมูลจาก Google Sheets API
  async function fetchData() {
    try {
      const response = await fetch(GAS_URL);
      const result = await response.json();

      if (result && result.length > 0) {
        const latest = result[0];
        document.getElementById('time-stamp').innerText = new Date(latest.timestamp).toLocaleString('th-TH');

        let totalV = 0;
        let activeCount = 0;
        let vList = [];
        let tList = [];

        // อัปเดตข้อมูลแรงดัน M1 - M35
        for (let i = 1; i <= 35; i++) {
          let val = parseFloat(latest[`m${i}`]) || 0;
          vList.push(val);
          const card = document.getElementById(`card-m${i}`);
          const valTxt = document.getElementById(`val-m${i}`);

          if (val > 0) {
            totalV += val;
            activeCount++;
            valTxt.innerText = val.toFixed(2) + " V";
            // หากแรงดันผิดปกติ (เช่น สูงเกิน 4.25V หรือต่ำกว่า 2.8V) แสดงสีเตือน
            if (val > 4.25 || val < 2.8) {
              card.className = "card state-warn";
            } else {
              card.className = "card state-ok";
            }
          } else {
            valTxt.innerText = "OFFLINE";
            card.className = "card state-off";
          }
        }

        // อัปเดตข้อมูลอุณหภูมิ T1 - T10
        for (let i = 1; i <= 10; i++) {
          let val = parseFloat(latest[`t${i}`]) || 0;
          tList.push(val);
          const card = document.getElementById(`card-t${i}`);
          const valTxt = document.getElementById(`val-t${i}`);

          if (val > 0) {
            valTxt.innerText = val.toFixed(1) + " °C";
            if (val > 55) { // เตือนเมื่ออุณหภูมิเกิน 55°C
              card.className = "card state-warn";
            } else {
              card.className = "card state-ok";
            }
          } else {
            valTxt.innerText = "OFFLINE";
            card.className = "card state-off";
          }
        }

        // แสดงผลรวม
        document.getElementById('total-voltage').innerText = totalV.toFixed(2);
        document.getElementById('active-count').innerText = activeCount;

        // อัปเดตข้อมูลลงกราฟ
        vChart.data.datasets[0].data = vList;
        vChart.update();

        tChart.data.datasets[0].data = tList;
        tChart.update();
      }
    } catch (err) {
      console.error("Fetch Data Error:", err);
    }
  }

  // เริ่มทำงานเมื่อโหลดหน้าเว็บ
  window.onload = () => {
    initGrids();
    initCharts();
    fetchData();
    setInterval(fetchData, 5000); // อัปเดตอัตโนมัติทุกๆ 5 วินาที
  };
</script>

</body>
</html>
